<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Job Notification Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="kn-app">
    <div class="kn-shell">
      <!-- Top Bar -->
      <header class="kn-topbar">
        <div class="kn-topbar__row">
          <div class="kn-topbar__project">
            <span class="kn-topbar__project-label">Project</span>
            <span class="kn-topbar__project-name">Job Notification Tracker</span>
          </div>

          <div class="kn-topbar__progress">
            <span class="kn-topbar__progress-label">Status</span>
            <span class="kn-topbar__progress-value">Active</span>
          </div>

          <div class="kn-topbar__status">
            <span class="kn-badge kn-badge--status kn-badge--status-active">Tracking</span>
          </div>
        </div>

        <div class="kn-topbar__nav-row">
          <button
            class="kn-nav__toggle"
            type="button"
            aria-label="Toggle navigation"
            aria-expanded="false"
          >
            ☰
          </button>
          <nav class="kn-nav" aria-label="Primary">
            <a href="#/dashboard" class="kn-nav__link" data-route-link="/dashboard">Dashboard</a>
            <a href="#/saved" class="kn-nav__link" data-route-link="/saved">Saved</a>
            <a href="#/digest" class="kn-nav__link" data-route-link="/digest">Digest</a>
            <a href="#/settings" class="kn-nav__link" data-route-link="/settings">Settings</a>
            <a href="#/proof" class="kn-nav__link" data-route-link="/proof">Proof</a>
          </nav>
        </div>
      </header>

      <!-- Context Header -->
      <section class="kn-context">
        <div class="kn-context__content" data-route-header>
          <h1 class="kn-heading-xl" data-route-title>Dashboard</h1>
          <p class="kn-text-md" data-route-subtitle>
            This section will be built in the next step.
          </p>
        </div>
      </section>

      <!-- Main Workspace -->
      <main class="kn-main">
        <section class="kn-primary">
          <div class="kn-card kn-card--primary" data-route-content>
            <!-- Route-specific content will be rendered here -->
          </div>
        </section>
      </main>

      <!-- Proof Footer -->
      <footer class="kn-proof">
        <div class="kn-proof__inner">
          <div class="kn-proof__item">
            <label class="kn-proof__label">
              <input type="checkbox" class="kn-proof__checkbox" />
              <span class="kn-proof__text">UI Built</span>
            </label>
            <input
              type="text"
              class="kn-input kn-proof__input"
              placeholder="Link, note, or reference"
            />
          </div>

          <div class="kn-proof__item">
            <label class="kn-proof__label">
              <input type="checkbox" class="kn-proof__checkbox" />
              <span class="kn-proof__text">Logic Working</span>
            </label>
            <input
              type="text"
              class="kn-input kn-proof__input"
              placeholder="How did you verify it?"
            />
          </div>

          <div class="kn-proof__item">
            <label class="kn-proof__label">
              <input type="checkbox" class="kn-proof__checkbox" />
              <span class="kn-proof__text">Test Passed</span>
            </label>
            <input
              type="text"
              class="kn-input kn-proof__input"
              placeholder="Test case or suite"
            />
          </div>

          <div class="kn-proof__item">
            <label class="kn-proof__label">
              <input type="checkbox" class="kn-proof__checkbox" />
              <span class="kn-proof__text">Deployed</span>
            </label>
            <input
              type="text"
              class="kn-input kn-proof__input"
              placeholder="Environment and build reference"
            />
          </div>
        </div>
      </footer>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
